<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
    <defs>
        <style>
            .bg { fill: #f8fafc; }
            .header-bg { fill: #0b3c70; }
            .header-text { fill: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; font-size: 20px; }
            .header-sub { fill: #94a3b8; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; }
            .nav-box { fill: rgba(255,255,255,0.15); stroke: rgba(255,255,255,0.3); rx: 4; }
            .nav-box-active { fill: #f9a825; rx: 4; }
            .nav-text { fill: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 500; }
            .nav-text-active { fill: #0b3c70; font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; }
            .card-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6; }
            .h2-title { fill: #0b3c70; font-family: 'Segoe UI', Arial, sans-serif; font-size: 22px; font-weight: bold; }
            .stat-box { fill: #ffffff; stroke: #cbd5e1; rx: 6; }
            .stat-num { font-family: 'Segoe UI', Arial, sans-serif; font-size: 28px; font-weight: bold; text-anchor: middle; }
            .stat-label { fill: #64748b; font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; text-transform: uppercase; }
            .th-bg { fill: #0b3c70; }
            .th-text { fill: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; }
            .td-text { fill: #1e293b; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; }
            .td-border { stroke: #e2e8f0; stroke-width: 1; }
            .badge-win { fill: #dcfce7; stroke: #bbf7d0; rx: 3; }
            .badge-loss { fill: #fee2e2; stroke: #fecaca; rx: 3; }
            .score-locked { fill: #f1f5f9; stroke: #cbd5e1; rx: 4; }
            .score-locked-text { fill: #64748b; font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-style: italic; }
            .footer-bg { fill: #0f172a; }
            .footer-text { fill: #64748b; font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; }
        </style>
    </defs>

    <rect width="1200" height="850" class="bg" />

    <!-- Browser Bar -->
    <rect width="1200" height="35" fill="#e2e8f0" />
    <circle cx="20" cy="18" r="6" fill="#ef4444" />
    <circle cx="38" cy="18" r="6" fill="#f59e0b" />
    <circle cx="56" cy="18" r="6" fill="#10b981" />
    <rect x="100" y="7" width="500" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <text x="115" y="22" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="12px">http://localhost/fotbalovy-klub/zapasy.php (Návrh logiky pro etapu 2)</text>

    <!-- Header -->
    <g transform="translate(0, 35)">
        <rect width="1200" height="80" class="header-bg" />
        <rect y="77" width="1200" height="3" fill="#f9a825" />
        <text x="60" y="38" class="header-text">FK Náchod - Mládež</text>
        <text x="60" y="58" class="header-sub">Informační systém pro správu mládežnických kategorií</text>
        <rect x="730" y="24" width="120" height="36" class="nav-box" />
        <text x="752" y="47" class="nav-text">Hráči</text>
        <rect x="865" y="24" width="120" height="36" class="nav-box-active" />
        <text x="888" y="47" class="nav-text-active">Zápasy</text>
        <rect x="1000" y="24" width="140" height="36" class="nav-box" />
        <text x="1018" y="47" class="nav-text">+ Přidat hráče</text>
    </g>

    <!-- Main Content -->
    <g transform="translate(60, 140)">
        
        <text x="0" y="24" class="h2-title">Mistrovská a přátelská utkání</text>
        <text x="0" y="48" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="13px">Demonstrace aplikační logiky: kontrola budoucích dat a dynamický výpočet výsledkové bilance.</text>

        <!-- Stats Counter Cards -->
        <g transform="translate(0, 70)">
            <!-- Card 1: Wins -->
            <rect x="0" y="0" width="250" height="80" class="stat-box" />
            <rect x="0" y="0" width="5" height="80" fill="#16a34a" rx="2" />
            <text x="125" y="42" class="stat-num" fill="#16a34a">3</text>
            <text x="125" y="64" class="stat-label">Výher celkem</text>

            <!-- Card 2: Draws -->
            <rect x="275" y="0" width="250" height="80" class="stat-box" />
            <rect x="275" y="0" width="5" height="80" fill="#d97706" rx="2" />
            <text x="400" y="42" class="stat-num" fill="#d97706">1</text>
            <text x="400" y="64" class="stat-label">Remíza</text>

            <!-- Card 3: Losses -->
            <rect x="550" y="0" width="250" height="80" class="stat-box" />
            <rect x="550" y="0" width="5" height="80" fill="#dc2626" rx="2" />
            <text x="675" y="42" class="stat-num" fill="#dc2626">1</text>
            <text x="675" y="64" class="stat-label">Prohra</text>

            <!-- Card 4: Total -->
            <rect x="825" y="0" width="255" height="80" class="stat-box" />
            <text x="952" y="42" class="stat-num" fill="#0b3c70">5</text>
            <text x="952" y="64" class="stat-label">Odehráno</text>
        </g>

        <!-- Table 1: Future Matches (Score Locked) -->
        <g transform="translate(0, 180)">
            <text x="0" y="20" fill="#0b3c70" font-family="'Segoe UI', Arial, sans-serif" font-size="16px" font-weight="bold">Plánovaná utkání (skóre nelze zadat - zápas ještě neproběhl)</text>
            
            <g transform="translate(0, 35)">
                <rect width="1080" height="110" class="card-bg" />
                <rect width="1080" height="34" class="th-bg" />
                <text x="20" y="22" class="th-text">Datum</text>
                <text x="180" y="22" class="th-text">Tým FK Náchod</text>
                <text x="400" y="22" class="th-text">Soupeř</text>
                <text x="700" y="22" class="th-text">Hřiště / Místo</text>
                <text x="940" y="22" class="th-text">Zadání skóre</text>

                <line x1="0" y1="72" x2="1080" y2="72" class="td-border" />
                <text x="20" y="58" class="td-text">23. 11. 2026</text>
                <text x="180" y="58" class="td-text">FK Náchod U13</text>
                <text x="400" y="58" class="td-text" font-weight="bold">SK Hronov U13</text>
                <text x="700" y="58" class="td-text">Náchod - hlavní hřiště</text>
                <rect x="940" y="44" width="120" height="26" class="score-locked" />
                <text x="952" y="61" class="score-locked-text">Čeká se na výkop</text>
            </g>
        </g>

        <!-- Table 2: Past Matches (Evaluated) -->
        <g transform="translate(0, 360)">
            <text x="0" y="20" fill="#0b3c70" font-family="'Segoe UI', Arial, sans-serif" font-size="16px" font-weight="bold">Odehraná utkání (datum v minulosti - automatické vyhodnocení výsledku)</text>
            
            <g transform="translate(0, 35)">
                <rect width="1080" height="150" class="card-bg" />
                <rect width="1080" height="34" class="th-bg" />
                <text x="20" y="22" class="th-text">Datum</text>
                <text x="180" y="22" class="th-text">Tým FK Náchod</text>
                <text x="400" y="22" class="th-text">Soupeř</text>
                <text x="700" y="22" class="th-text">Prostředí</text>
                <text x="940" y="22" class="th-text">Konečný výsledek</text>

                <!-- Match 1 -->
                <line x1="0" y1="72" x2="1080" y2="72" class="td-border" />
                <rect x="0" y="34" width="4" height="38" fill="#16a34a" />
                <text x="20" y="58" class="td-text">09. 11. 2026</text>
                <text x="180" y="58" class="td-text">FK Náchod U17</text>
                <text x="400" y="58" class="td-text">FK Dvůr Králové U17</text>
                <text x="700" y="58" class="td-text">Domácí</text>
                <rect x="940" y="44" width="100" height="24" class="badge-win" />
                <text x="955" y="60" fill="#15803d" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" font-weight="bold">2 : 1 (Výhra)</text>

                <!-- Match 2 -->
                <line x1="0" y1="110" x2="1080" y2="110" class="td-border" />
                <rect x="0" y="72" width="4" height="38" fill="#dc2626" />
                <text x="20" y="96" class="td-text">02. 11. 2026</text>
                <text x="180" y="96" class="td-text">FK Náchod U15</text>
                <text x="400" y="96" class="td-text">SK Nové Město U15</text>
                <text x="700" y="96" class="td-text">Venkovní</text>
                <rect x="940" y="82" width="105" height="24" class="badge-loss" />
                <text x="955" y="98" fill="#991b1b" font-family="'Segoe UI', Arial, sans-serif" font-size="12px" font-weight="bold">1 : 3 (Prohra)</text>
            </g>
        </g>

    </g>

    <g transform="translate(0, 800)">
        <rect width="1200" height="50" class="footer-bg" />
        <text x="600" y="30" class="footer-text" text-anchor="middle">Maturitní projekt: Informační systém pro mládežnický fotbalový klub | Autor: Tadeáš | Školní rok 2026/2027</text>
    </g>
</svg>
