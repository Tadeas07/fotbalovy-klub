<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850">
    <defs>
        <style>
            .bg { fill: #f8fafc; }
            .header-bg { fill: #0b3c70; }
            .header-text { fill: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; font-weight: bold; font-size: 20px; }
            .header-sub { fill: #94a3b8; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; }
            .nav-box { fill: rgba(255,255,255,0.15); stroke: rgba(255,255,255,0.3); rx: 4; }
            .nav-text { fill: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: 500; }
            .card-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; rx: 6; }
            .btn-back { fill: #f1f5f9; stroke: #cbd5e1; rx: 4; }
            .btn-back-text { fill: #334155; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; }
            .player-title { fill: #0b3c70; font-family: 'Segoe UI', Arial, sans-serif; font-size: 22px; font-weight: bold; }
            .prop-label { fill: #64748b; font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: bold; text-transform: uppercase; }
            .prop-val { fill: #0f172a; font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; }
            .th-bg { fill: #0b3c70; }
            .th-text { fill: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; }
            .td-text { fill: #1e293b; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; }
            .td-border { stroke: #e2e8f0; stroke-width: 1; }
            .btn-gray { fill: #e2e8f0; stroke: #cbd5e1; rx: 4; }
            .btn-gray-text { fill: #334155; font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; }
            .note-box { fill: #f8fafc; stroke: #cbd5e1; stroke-dasharray: 4,4; rx: 4; }
            .note-text { fill: #64748b; font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; font-style: italic; }
            .footer-bg { fill: #0f172a; }
            .footer-text { fill: #64748b; font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; }
        </style>
    </defs>

    <rect width="1200" height="850" class="bg" />

    <!-- Browser Bar -->
    <rect width="1200" height="35" fill="#e2e8f0" />
    <circle cx="20" cy="18" r="6" fill="#ef4444" />
    <circle cx="38" cy="18" r="6" fill="#f59e0b" />
    <circle cx="56" cy="18" r="6" fill="#10b981" />
    <rect x="100" y="7" width="500" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" />
    <text x="115" y="22" fill="#64748b" font-family="'Segoe UI', Arial, sans-serif" font-size="12px">http://localhost/fotbalovy-klub/detail.php?id=12</text>

    <!-- Header -->
    <g transform="translate(0, 35)">
        <rect width="1200" height="80" class="header-bg" />
        <rect y="77" width="1200" height="3" fill="#f9a825" />
        <text x="60" y="38" class="header-text">FK Náchod - Mládež</text>
        <text x="60" y="58" class="header-sub">Informační systém pro správu mládežnických kategorií</text>
        <rect x="850" y="24" width="130" height="36" class="nav-box" />
        <text x="872" y="47" class="nav-text">Seznam hráčů</text>
        <rect x="995" y="24" width="150" height="36" class="nav-box" />
        <text x="1012" y="47" class="nav-text">+ Přidat hráče</text>
    </g>

    <!-- Main Content -->
    <g transform="translate(60, 140)">
        
        <!-- Back Button -->
        <rect width="180" height="32" class="btn-back" />
        <text x="15" y="21" class="btn-back-text">&larr; Zpět na seznam hráčů</text>

        <!-- Player Detail Card -->
        <g transform="translate(0, 50)">
            <rect width="1080" height="210" class="card-bg" />
            
            <!-- Card Header -->
            <text x="25" y="38" class="player-title">Kratochvíl Martin</text>
            <rect x="220" y="20" width="75" height="22" fill="#fee2e2" stroke="#fecaca" rx="3" />
            <text x="233" y="35" fill="#991b1b" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" font-weight="bold">ÚTOČNÍK</text>
            <line x1="25" y1="55" x2="1055" y2="55" class="td-border" />

            <!-- Grid Details -->
            <g transform="translate(25, 75)">
                <!-- Col 1 -->
                <text x="0" y="15" class="prop-label">Datum narození</text>
                <text x="0" y="36" class="prop-val">30. 03. 2012 <tspan fill="#64748b">(věk: 14 let)</tspan></text>

                <text x="0" y="75" class="prop-label">Přiřazený tým</text>
                <text x="0" y="96" class="prop-val">FK Náchod U15 <tspan font-weight="bold">(U15)</tspan></text>

                <!-- Col 2 -->
                <text x="400" y="15" class="prop-label">Telefon na zákonného zástupce</text>
                <text x="400" y="36" class="prop-val">723 000 004</text>

                <text x="400" y="75" class="prop-label">E-mail na zákonného zástupce</text>
                <text x="400" y="96" class="prop-val" fill="#0284c7">kratochvil.rodic@seznam.cz</text>

                <!-- Col 3 -->
                <text x="800" y="15" class="prop-label">Stav registrace</text>
                <text x="800" y="36" class="prop-val">Aktivní člen klubu</text>

                <text x="800" y="75" class="prop-label">Datum zaevidování</text>
                <text x="800" y="96" class="prop-val">13. 11. 2026 15:45</text>
            </g>
        </g>

        <!-- Teammates Section -->
        <g transform="translate(0, 285)">
            <text x="0" y="24" class="player-title" font-size="18px">Spoluhráči v kategorii U15</text>
            
            <g transform="translate(0, 40)">
                <rect width="1080" height="180" class="card-bg" />
                
                <rect width="1080" height="36" class="th-bg" />
                <text x="20" y="23" class="th-text">Příjmení a jméno</text>
                <text x="400" y="23" class="th-text">Herní pozice</text>
                <text x="700" y="23" class="th-text">Datum narození</text>
                <text x="960" y="23" class="th-text">Profil</text>

                <!-- Row 1 -->
                <line x1="0" y1="80" x2="1080" y2="80" class="td-border" />
                <text x="20" y="64" class="td-text" font-weight="bold">Beneš Tomáš</text>
                <rect x="400" y="50" width="75" height="20" fill="#fef3c7" stroke="#fde68a" rx="3" />
                <text x="412" y="64" fill="#92400e" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" font-weight="bold">BRANKÁŘ</text>
                <text x="700" y="64" class="td-text">25. 04. 2011</text>
                <rect x="960" y="50" width="65" height="24" class="btn-gray" />
                <text x="972" y="66" class="btn-gray-text">Zobrazit</text>

                <!-- Row 2 -->
                <line x1="0" y1="125" x2="1080" y2="125" class="td-border" />
                <text x="20" y="109" class="td-text" font-weight="bold">Fiala Jan</text>
                <rect x="400" y="95" width="75" height="20" fill="#e0f2fe" stroke="#bae6fd" rx="3" />
                <text x="412" y="109" fill="#0369a1" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" font-weight="bold">ZÁLOŽNÍK</text>
                <text x="700" y="109" class="td-text">01. 12. 2011</text>
                <rect x="960" y="95" width="65" height="24" class="btn-gray" />
                <text x="972" y="111" class="btn-gray-text">Zobrazit</text>

                <!-- Row 3 -->
                <line x1="0" y1="170" x2="1080" y2="170" class="td-border" />
                <text x="20" y="154" class="td-text" font-weight="bold">Šťastný David</text>
                <rect x="400" y="140" width="75" height="20" fill="#dcfce7" stroke="#bbf7d0" rx="3" />
                <text x="412" y="154" fill="#15803d" font-family="'Segoe UI', Arial, sans-serif" font-size="11px" font-weight="bold">OBRÁNCE</text>
                <text x="700" y="154" class="td-text">12. 08. 2012</text>
                <rect x="960" y="140" width="65" height="24" class="btn-gray" />
                <text x="972" y="156" class="btn-gray-text">Zobrazit</text>
            </g>
        </g>

        <!-- Phase 2 Note -->
        <g transform="translate(0, 530)">
            <rect width="1080" height="40" class="note-box" />
            <text x="20" y="25" class="note-text">Poznámka: Statistika zápasů a účast na trénincích hráče bude napojena v následující etapě projektu po dokončení příslušných modulů.</text>
        </g>

    </g>

    <g transform="translate(0, 800)">
        <rect width="1200" height="50" class="footer-bg" />
        <text x="600" y="30" class="footer-text" text-anchor="middle">Maturitní projekt: Informační systém pro mládežnický fotbalový klub | Autor: Tadeáš | Školní rok 2026/2027</text>
    </g>
</svg>
